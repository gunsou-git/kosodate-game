// ---------- utils ----------
function randn(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function Phi(z){const t=1/(1+.2316419*Math.abs(z)),d=.3989423*Math.exp(-z*z/2);let p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p}
const pct=z=>Math.max(1,Math.min(99,Math.round(Phi(z)*100)));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const pick=a=>a[Math.floor(Math.random()*a.length)];

function sayLevel(p){return p>=85?"とても高い":p>=65?"高め":p>=36?"ふつう":p>=16?"低め":"とても低い"}

let setup={name:"",p1:{},p2:{},dna:true};
TRAITS.forEach(t=>{setup.p1[t.k]=0;setup.p2[t.k]=0});
let G=null, S=null, history=[]; // history: finished runs for comparison

function makeChildGenes(){
  // parent genetic value ≈ chosen level × sqrt(h2) + noise; child = midparent + segregation (var .5)
  const g={};
  TRAITS.forEach(t=>{const h=Math.sqrt(t.h[5]);
    const a=setup.p1[t.k]*h+randn()*Math.sqrt(1-h*h)*.8, b=setup.p2[t.k]*h+randn()*Math.sqrt(1-h*h)*.8;
    g[t.k]=clamp(.5*a+.5*b+randn()*Math.sqrt(.5),-2.6,2.6)});
  return g;
}
function newRun(genes){
  const pgs={};TRAITS.forEach(t=>pgs[t.k]=.45*genes[t.k]+Math.sqrt(1-.2025)*randn());
  S={turn:0,C:{},E:{},rel:60,joy:60,z:null,parts:null,events:[],log:[],chosen:[],favHits:0,favTotal:0,examDone:false,pgs,decisions:[]};
  TRAITS.forEach(t=>{S.C[t.k]=0;S.E[t.k]=0});
  G=genes;
}
function observe(i){ // i: 0..5 => ages 3..18
  const z={},parts={};
  TRAITS.forEach(t=>{const h=t.h[i],c=t.c[i],e=Math.max(0,1-h-c);
    const g=Math.sqrt(h)*G[t.k], en=Math.sqrt(c)*S.C[t.k], lk=Math.sqrt(e)*S.E[t.k];
    z[t.k]=g+en+lk; parts[t.k]={g,en,lk,h,c,e}});
  S.z=z;S.parts=parts;
}
function interests(){ // noisy reading of genes
  const r=TRAITS.map(t=>({t,v:G[t.k]+randn()*.55})).sort((a,b)=>b.v-a.v);
  return {top:r.slice(0,2),bottom:r[r.length-1]};
}

function topGene(){return TRAITS.slice().sort((a,b)=>G[b.k]-G[a.k])[0]}
function advance(){
  const age=AGES[S.turn], chosen=[...selected].map(id=>ACTIONS.find(a=>a.id===id)), fb=[];
  // shared environment: decays, then actions push it
  TRAITS.forEach(t=>S.C[t.k]*=.55);
  let dRel=0,dJoy=0;
  chosen.forEach(a=>{
    if(a.special==="fav"){const t=topGene();S.C[t.k]+=1.2;dRel+=8;dJoy+=8;S.favHits++;
      fb.push(`「好き」を応援したことで、${esc(setup.name)}は<b>${t.n}</b>に関わることにますます打ち込みました。子どもが自分の傾向に合う環境を選ぶ「環境のなかの遺伝」そのものです。`)}
    Object.entries(a.eff).forEach(([k,v])=>{S.C[k]+=v;
      const g=G[k]; dRel+=1+4*g; dJoy+=1+5*g;});
    if(a.rel){dRel+=a.rel;dJoy+=a.rel<0?-4:4}
    if(a.special==="exam"){S.examDone=true;dRel+=8*G.study-4;dJoy+=8*G.study-6;
      fb.push(G.study>0.3?`中学受験の勉強に、${esc(setup.name)}は意外なほど乗り気でした。もともと勉強に向いた傾向があったようです。`:`中学受験の勉強は${esc(setup.name)}にとって負担が大きく、家の空気がぴりぴりする日が増えました。`)}
    const pushAgainst=Object.keys(a.eff).filter(k=>a.eff[k]>=1&&G[k]<-.5);
    if(pushAgainst.length)fb.push(`${a.n}は、${esc(setup.name)}の苦手な方向でした。続けてはいますが、楽しそうではありません。木目に逆らうと、親子関係に代償が出ることがあります。`);
  });
  if(!chosen.length){dRel+=1;fb.push("この間は、特に何もせず見守りました。それでも子どもは、自分のペースで育っていきます。")}
  TRAITS.forEach(t=>S.C[t.k]=clamp(S.C[t.k],-2.5,2.5));
  // rebellious years: gains are halved and the relationship drifts down
  const teen=age===12||age===15;
  if(teen){dRel-=6;dJoy-=3;if(age===12)fb.push(`${esc(setup.name)}が反抗期に入りました。話しかけても返事が短く、親子の会話が減っていきます。どの家庭にもある時期です。`)}
  // relationships need tending: both drift 15% back toward 55 every turn
  S.rel+=(55-S.rel)*.15; S.joy+=(55-S.joy)*.15;
  // diminishing returns near the top: gains shrink as the value approaches 100
  const grow=(cur,d)=>d>0?d*(teen?.5:1)*Math.max(0,(100-cur)/45):d;
  S.rel=clamp(S.rel+grow(S.rel,dRel)+randn()*2,5,100);S.joy=clamp(S.joy+grow(S.joy,dJoy)+randn()*4,5,100);
  // non-shared env: random, weakly persistent; 1–2 events
  const evs=[],pool=EVENTS.filter(e=>e.a.includes(age));
  const n=Math.random()<.55?1:2;
  for(let i=0;i<n&&pool.length;i++){const e=pool.splice(Math.floor(Math.random()*pool.length),1)[0];evs.push(e)}
  TRAITS.forEach(t=>{S.E[t.k]=.3*S.E[t.k]+Math.sqrt(.91)*randn()});
  evs.forEach(e=>{Object.entries(e.e).forEach(([k,v])=>S.E[k]+=v*1.4);
    e.note=Object.values(e.e)[0]>0?"うれしい出来事でした。ただ、こうした偶然の影響は長くは続かないことがわかっています。":"つらい時期でした。それでも子どもは、時間とともに自分の軌道に戻っていきます。"});
  S.decisions.push({age,ids:chosen.map(a=>a.id)});
  S.log.push({events:evs,fb});
  S.turn++;
  observe(S.turn-1);
  if(chosen.some(a=>a.special==="exam")){const sc=pct(S.z.study+randn()*.45);
    S.exam=sc>=62?{ok:true,title:"第一志望校に合格しました",msg:"努力が実り、第一志望の中高一貫校に進学します。"}:sc>=45?{ok:true,title:"第二志望校に合格しました",msg:"第一志望には届きませんでしたが、第二志望の中高一貫校に進学します。"}:{ok:false,title:"中学受験は不合格でした",msg:"残念ながら合格は届かず、地元の公立中学校に進学します。"};}
  if(S.turn>=AGES.length-1)renderEnd();else renderTurn();
  window.scrollTo({top:0});
}
// ---------- ending ----------
function counterfactualNoParent(){ // same genes & luck, parenting effects removed
  const z={};TRAITS.forEach(t=>{const p=S.parts[t.k];z[t.k]=p.g+p.lk});return z;
}
function path(z){
  const P={};TRAITS.forEach(t=>P[t.k]=pct(z[t.k]));
  const top=TRAITS.slice().sort((a,b)=>P[b.k]-P[a.k])[0];
  const abroad=S.decisions.some(d=>d.ids.includes("abroad")), univ=S.route!=="senmon";
  let r;
  if(P.sport>=88) r={text:"実業団でスポーツを続けながら働き、日本代表をめざしています。",short:"実業団で日本代表をめざす"};
  else if(univ&&P.study>=75&&["study","create"].includes(top.k)) r={text:"大学院で研究を深めたあと、専門職として社会に出ました。",short:"大学院を出て専門職へ"};
  else if(P.social>=72&&P.calm>=55) r={text:"学生時代の仲間と会社を立ち上げ、起業家として走りはじめました。",short:"起業家として独立"};
  else if(P.create>=75&&P.social<55) r={text:"会社には入らず、フリーランスのクリエイターとして仕事を受けています。",short:"フリーランスのクリエイターに"};
  else if(abroad&&P.social>=55) r={text:"留学先で生まれた縁から、海外の企業で働いています。",short:"海外で就職"};
  else if(!univ) r={text:"専門学校で手に職をつけて就職し、社会人4年目の頼れる中堅になっています。",short:"手に職をつけて活躍中"};
  else{
    const base=P.study>=40?"大学を卒業して就職し、社会人2年目を迎え、":"大学をなんとか卒業して就職し、社会人2年目を迎え、";
    const flav={study:"仕事でも専門性を深めています。",social:"人と関わる仕事で頼られる存在になりつつあります。",calm:"新しい職場でも落ち着いて周りを支えています。",sport:"仕事のかたわら、スポーツを本気で続けています。",create:"ものづくりや表現の仕事に就きました。"}[top.k];
    const sh={study:"専門性を武器に就職",social:"人と関わる仕事で活躍中",calm:"職場の頼れる存在に",sport:"仕事とスポーツを両立",create:"ものづくりの仕事に就職"}[top.k];
    r={text:base+flav,short:sh};
  }
  S.pathShort=r.short; return r;
}
function parentType(){
  const c={};S.decisions.forEach(d=>d.ids.forEach(id=>c[id]=(c[id]||0)+1));
  const n=k=>k.reduce((t,id)=>t+(c[id]||0),0), total=Object.values(c).reduce((a,b)=>a+b,0);
  if(n(["fav"])>=4)return "「好き」全力応援型";
  if(n(["juku","exam","tuition","push"])>=4)return "教育熱心型";
  if(n(["strict","push"])>=3)return "鬼コーチ型";
  if(n(["sportclub","park"])>=3)return "体育会型";
  if(n(["music","art"])>=3)return "アート支援型";
  if(n(["talk"])>=4)return "いつもそばにいる型";
  if(total<=8)return "どっしり見守り型";
  return "バランス型";
}
function shareText(P,sh){
  const top=TRAITS.slice().sort((a,b)=>P[b.k]-P[a.k])[0];
  const job=S.pathShort||"社会人として活躍中";
  return `${setup.name}を24歳まで育ててみた結果、${job}！
私は「${parentType()}」の親でした。
学力${P.study} 社交${P.social} 落着${P.calm} 運動${P.sport} 創造${P.create}
個性を決めたのは
遺伝${sh("g")}% 偶然${sh("lk")}% 子育て${sh("en")}%
#子育てを間違えないために #こころは遺伝する
https://sasakimakoto1974.github.io/kosodate-game/`;
}
function renderEnd(){
  strip(AGES.length-1);
  const nm=esc(setup.name), z=S.z, cf=counterfactualNoParent(), prev=history[history.length-1];
  const rows=TRAITS.map(t=>{const p=S.parts[t.k], tot=pct(z[t.k]), cfp=pct(cf[t.k]);
    const sc=40; const seg=(v,col,off)=>{const w=Math.min(48,Math.abs(v)*sc);return {w,html:""}};
    // stacked diverging bar: gene, parenting, luck
    let posX=50,negX=50,bars="";
    [["g","var(--gene)"],["en","var(--env)"],["lk","var(--luck)"]].forEach(([k,col])=>{const v=p[k],w=Math.min(46,Math.abs(v)*sc*0.5);
      if(v>=0){bars+=`<i style="left:${posX}%;width:${w}%;background:${col}"></i>`;posX+=w}else{negX-=w;bars+=`<i style="left:${negX}%;width:${w}%;background:${col}"></i>`}});
    const diff=tot-cfp;
    return `<tr><td>${t.n}</td><td class="n">${tot}</td><td><div class="decomp"><div class="axis"></div>${bars}</div></td><td class="n">${cfp}</td><td class="n ${diff>0?"pos":diff<0?"neg":""}">${diff>0?"+":""}${diff}</td>${prev?`<td class="n">${prev.P[t.k]}</td>`:""}</tr>`}).join("");
  // share of variance-ish summary
  const sum={g:0,en:0,lk:0};TRAITS.forEach(t=>{const p=S.parts[t.k];sum.g+=Math.abs(p.g);sum.en+=Math.abs(p.en);sum.lk+=Math.abs(p.lk)});
  const tot=sum.g+sum.en+sum.lk, sh=k=>Math.round(sum[k]/tot*100);
  const favT=topGene();
  const fit=S.decisions.some(d=>d.ids.includes("fav"));
  const P={};TRAITS.forEach(t=>P[t.k]=pct(z[t.k]));
  const relMsg=S.rel>=75?"親子のきずなはとても強く、いまでも何でも話せる関係です。":S.rel>=45?"ぶつかる時期もありましたが、親子の関係はおおむね良好です。":"気持ちがすれ違う時期が長く、親子の会話は少なくなってしまいました。";
  stage.innerHTML=`<section class="card"><div class="eyebrow">24歳、社会人2年目になりました</div>
    <p class="big">${nm}は、${path(z).text}</p>
    ${traitBars(z,prev?prev.P:null)}<p class="sub">同年代100人の中での位置（50が平均）。${prev?"黒い線は、前回同じ遺伝子で育てたときの結果です。":""}</p>
    ${meters()}<p>${relMsg}</p>
  </section>
  <section class="card"><h2>${nm}の個性は、何で決まったのか</h2>
    <p>24歳時点の個性を、<b>遺伝</b>・<b>あなたの子育て</b>・<b>偶然の出来事</b>に分けました。右の2列は、同じ遺伝子と同じ偶然のまま、子育ての効果だけをなくした場合です。</p>
    <div class="legend"><span><i style="background:var(--gene)"></i>遺伝</span><span><i style="background:var(--env)"></i>子育て（共有環境）</span><span><i style="background:var(--luck)"></i>偶然（非共有環境）</span><span>中心線より右は平均を押し上げ、左は押し下げた分</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>個性</th><th>結果</th><th>何が効いたか</th><th>子育てなし</th><th>差</th>${prev?"<th>前回</th>":""}</tr></thead><tbody>${rows}</tbody></table></div>
    <p>今回の育ちでは、個性を平均から動かした力のおよそ<b>${sh("g")}%が遺伝</b>、<b>${sh("lk")}%が偶然</b>、<b>${sh("en")}%が子育て</b>でした。大人になるころには、子育ての影響はほとんど消えていきます。</p>
  </section>
  <section class="card"><h2>この24年から言えること</h2>
    <ul class="lessons">
      <li>${nm}が生まれつきいちばん強く持っていた傾向は<b>${favT.n}</b>でした。${fit?"「好き」を応援したことで、その傾向に合った環境を選びやすくなりました。":"「好き」を応援する選択をすると、親子のきずなと毎日の楽しさが大きく伸びます。"}<span class="src">環境のなかの遺伝・遺伝的増幅</span></li>
      <li>塾や習い事の効果は、子どもが小さいうちは見えますが、大学を出るころにはほとんど残りません。家族が共有する環境の影響は、青年期に消えていきます。<span class="src">共有環境の影響の消失</span></li>
      ${S.examDone?`<li>中学受験の結果は「${S.exam?S.exam.title.replace(/しました|でした/,""):""}」でした。中学受験は、${G.study>0.3?"勉強に向いた傾向をもつ"+nm+"には合っていました":"勉強がそれほど向いていなかった"+nm+"にとって負担が大きかった"}ようです。選抜校の成績が高いのは、主に入学前の生徒の違いによるものです。<span class="src">選抜校と非選抜校</span></li>`:""}
      <li>就職や進学の行き先にも遺伝が関わります。職業的地位と収入の遺伝率は約40%で、親が進路を決めても、その子らしさに沿わない道は長続きしにくいものです。<span class="src">職業的地位と収入</span></li>
      <li>出来事の影響はその時々で大きく見えても、長続きしません。人は環境の凹凸にぶつかったあと、自分の遺伝的な軌道に戻っていきます。<span class="src">非共有環境</span></li>
      <li>それでも、子育ては無意味ではありません。子どもが「今日」を楽しく過ごせるか、親子がどんな関係を結ぶかは、親しだいです。<span class="src">あとがき</span></li>
    </ul>
  </section>
  <section class="card" id="sharecard"><h2>結果をシェアする</h2>
    <p class="sub">育てた結果を、XなどのSNSに投稿できる形にまとめました。</p>
    <textarea id="sharetext" readonly rows="8">${esc(shareText(P,sh))}</textarea>
    <div class="row"><button class="btn" id="copy">テキストをコピー</button><a class="btn ghost" id="xpost" target="_blank" rel="noopener" href="https://x.com/intent/post?text=${encodeURIComponent(shareText(P,sh))}">Xで投稿する</a><span class="sub" id="copied" aria-live="polite"></span></div>
  </section>
  <section class="card"><h2>もう一度育てる</h2>
    <p class="sub">同じ遺伝子でやり直すと、子育ての選択を変えても24歳の姿があまり変わらないことを確かめられます。きょうだいを育てると、同じ両親からでも違う子が生まれることがわかります。</p>
    <div class="row"><button class="btn" id="same">同じ子をもう一度育てる</button><button class="btn ghost" id="sib">きょうだいを育てる</button><button class="btn ghost" id="reset">両親の設定からやり直す</button></div>
  </section>`;
  const finished={P};
  document.getElementById("copy").onclick=()=>{const ta=document.getElementById("sharetext"),msg=document.getElementById("copied");
    const fallback=()=>{ta.focus();ta.select();msg.textContent="選択しました。コピーしてください。"};
    try{navigator.clipboard.writeText(ta.value).then(()=>msg.textContent="コピーしました",fallback)}catch(e){fallback()}};
  document.getElementById("same").onclick=()=>{history.push(finished);newRun(G);renderTurn();window.scrollTo({top:0})};
  document.getElementById("sib").onclick=()=>{history=[];newRun(makeChildGenes());renderTurn();window.scrollTo({top:0})};
  document.getElementById("reset").onclick=()=>{history=[];renderSetup();window.scrollTo({top:0})};
}
renderSetup();
</script>
</body>
